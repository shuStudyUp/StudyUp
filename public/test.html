<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyUp Test Page</title>
  <script src="https://code.jquery.com/jquery-latest.min.js"></script>
  <style>
    /* body 스타일: 전체 페이지의 폰트, 마진, 배경색, 글자색을 설정합니다. */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f7f6;
      color: #333;
    }
    /* container 스타일: 페이지 콘텐츠를 담는 중앙 정렬된 컨테이너의 최대 너비, 마진, 배경, 패딩, 그림자 등을 설정합니다. */
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    /* h2 스타일: 섹션 제목의 중앙 정렬, 색상, 하단 마진을 설정합니다. */
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
    }
    /* section 스타일: 각 기능 섹션의 하단 마진, 패딩, 테두리, 배경색, 테두리 반경을 설정합니다. */
    .section {
      margin-bottom: 30px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background-color: #fff;
    }
    /* section h3 스타일: 섹션 내 소제목의 색상과 하단 마진을 설정합니다. */
    .section h3 {
      color: #3498db;
      margin-bottom: 15px;
    }
    /* 입력 필드 스타일: 텍스트, 이메일, 비밀번호, 텍스트 영역 입력 필드의 너비, 패딩, 마진, 테두리, 테두리 반경을 설정합니다. */
    input[type="text"], input[type="email"], input[type="password"], textarea {
      width: calc(100% - 22px);
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    /* 버튼 스타일: 버튼의 배경색, 글자색, 테두리, 패딩, 테두리 반경, 커서, 마진, 전환 효과를 설정합니다. */
    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 5px;
      transition: background-color 0.3s ease;
    }
    /* 버튼 호버 스타일: 마우스 오버 시 버튼의 배경색을 변경합니다. */
    button:hover {
      background-color: #2980b9;
    }
    /* 메시지 표시 영역 스타일: AJAX 응답 메시지를 표시하는 div 요소들의 상단 마진, 공백 처리, 테두리, 패딩, 최소 높이, 배경색, 테두리 반경을 설정합니다. */
    #chatResponse, #userListResponse, #userStatsResponse, #problemListResponse, #selectResultDisplay,
    .message-display {
      margin-top: 10px;
      white-space: pre-wrap;
      border: 1px solid #eee;
      padding: 10px;
      width: 100%;
      min-height: 50px;
      background-color: #f9f9f9;
      border-radius: 5px;
    }
    /* 에러 메시지 스타일: 에러 메시지의 글자색과 폰트 굵기, 상단 마진을 설정합니다. */
    .error-message {
      color: red;
      font-weight: bold;
      margin-top: 5px;
    }
    /* 성공 메시지 스타일: 성공 메시지의 글자색과 폰트 굵기, 상단 마진을 설정합니다. */
    .success-message {
      color: green;
      font-weight: bold;
      margin-top: 5px;
    }
    /* 수평선 스타일: 섹션 구분선의 마진과 테두리 스타일을 설정합니다. */
    hr {
      margin: 30px 0;
      border: 0;
      border-top: 1px solid #eee;
    }
    /* '회원가입' 링크 스타일: 로그인 섹션 내 회원가입 링크의 색상, 커서, 텍스트 밑줄을 설정합니다. */
    .scroll-to-section {
      color: #3498db;
      cursor: pointer;
      text-decoration: underline;
    }
    /* '회원가입' 링크 호버 스타일: 마우스 오버 시 링크의 색상을 변경합니다. */
    .scroll-to-section:hover {
      color: #2980b9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>StudyUp 테스트 페이지</h2>

    <div class="section" id="chatSection">
      <h3>ChatGPT 연동</h3>
      <input type="text" id="chatInput" placeholder="ChatGPT에게 질문하기" />
      <button onclick="sendChat()">전송</button>
      <div id="chatResponse" class="message-display"></div>
    </div>

    <hr />

    <div class="section">
      <h3>기존 데이터 관리 (test_tb)</h3>
      <button onclick="test_select()">Select (모든 데이터 조회)</button>
      <div id="selectResultDisplay" class="message-display"></div>
      <br>
      <input type="text" id="insertNameInput" placeholder="추가할 이름 입력" />
      <button onclick="test_insert($('#insertNameInput').val())">Insert (데이터 추가)</button>
      <div id="insertStatusMessage" class="message-display"></div>
      <br>
      <input type="text" id="deleteNameInput" placeholder="삭제할 이름 입력" />
      <button onclick="test_delete($('#deleteNameInput').val())">Delete (데이터 삭제)</button>
      <div id="deleteStatusMessage" class="message-display"></div>
    </div>

    <hr />

    <div class="section" id="loginSection">
      <h3>로그인</h3>
      <input type="text" id="loginUsernameOrEmail" placeholder="사용자 이름 또는 이메일" />
      <input type="password" id="loginPassword" placeholder="비밀번호" />
      <button onclick="loginUser()">로그인</button>
      <button onclick="logoutUser()">로그아웃</button>
      <div id="loginStatus" class="message-display"></div>
      <p>계정이 없으신가요? <span class="scroll-to-section" onclick="scrollToSection('userManagementSection')">회원가입</span></p>
    </div>

    <hr />

    <div class="section" id="userManagementSection">
      <h3>사용자 관리 (users 테이블)</h3>
      <h4>사용자 생성</h4>
      <input type="text" id="createUsername" placeholder="사용자 이름" />
      <input type="email" id="createUserEmail" placeholder="이메일" />
      <input type="password" id="createUserPassword" placeholder="비밀번호" />
      <button onclick="createUser()">사용자 생성</button>
      <div id="createUserStatus" class="message-display"></div>

      <h4>사용자 목록</h4>
      <button onclick="listUsers()">사용자 목록 조회</button>
      <div id="userListResponse" class="message-display"></div>

      <h4>사용자 통계</h4>
      <button onclick="getUserStats()">사용자 통계 조회</button>
      <div id="userStatsResponse" class="message-display"></div>

      <h4>사용자 삭제</h4>
      <input type="text" id="deleteUserId" placeholder="삭제할 사용자 ID 입력" />
      <button onclick="deleteUser()">사용자 삭제</button>
      <div id="deleteUserStatus" class="message-display"></div>
    </div>

    <hr />

    <div class="section">
      <h3>문제 은행 관리 (problems 테이블)</h3>
      <h4>문제 추가 (수동)</h4>
      <input type="text" id="addProblemQuestion" placeholder="문제 내용 입력 (예: 2 + 2는 무엇인가요?)" />
      <input type="text" id="addProblemAnswer" placeholder="정답 입력 (예: 4)" />
      <input type="text" id="addProblemCategory" placeholder="카테고리 입력 (예: 수학)" />
      <input type="text" id="addProblemDifficulty" placeholder="난이도 입력 (예: 하, 중, 상)" />
      <button onclick="addProblem()">문제 추가</button>
      <div id="addProblemStatus" class="message-display"></div>

      <h4>문제 목록</h4>
      <button onclick="listProblems()">문제 목록 조회</button>
      <div id="problemListResponse" class="message-display"></div>

      <h4>문제 삭제</h4>
      <input type="text" id="deleteProblemId" placeholder="삭제할 문제 ID 입력" />
      <button onclick="deleteProblem()">문제 삭제</button>
      <div id="deleteProblemStatus" class="message-display"></div>
    </div>
  </div>

  <script>
    // displayMessage 함수: 특정 요소에 메시지를 표시하고, 메시지 타입(성공/에러)에 따라 스타일을 적용합니다.
    function displayMessage(elementId, message, type = 'error') {
      const element = $(`#${elementId}`);
      element.removeClass('error-message success-message').text(''); // 기존 클래스와 텍스트 초기화
      if (message) {
        if (type === 'error') element.addClass('error-message'); // 에러 메시지 스타일 적용
        else if (type === 'success') element.addClass('success-message'); // 성공 메시지 스타일 적용
        element.text(message); // 메시지 텍스트 설정
      }
    }

    // sendChat 함수: ChatGPT에 질문을 보내고 응답을 받습니다.
    function sendChat() {
      const message = $('#chatInput').val().trim(); // 입력 필드에서 메시지 가져오기
      const responseDiv = 'chatResponse'; // 응답을 표시할 div의 ID
      if (!message) return displayMessage(responseDiv, '메시지를 입력하세요.', 'error'); // 메시지가 없으면 에러 표시
      displayMessage(responseDiv, '응답 대기 중...', 'success'); // 응답 대기 메시지 표시
      $.ajax({
        url: '/chat', // 요청을 보낼 백엔드 엔드포인트
        method: 'POST', // HTTP 메소드
        contentType: 'application/json', // 요청 본문의 컨텐츠 타입
        data: JSON.stringify({ message }), // JSON 형식으로 메시지 전송
        success: function(res) {
          displayMessage(responseDiv, res.reply, 'success'); // 성공 시 응답 메시지 표시
          $('#chatInput').val(''); // 입력 필드 초기화
        },
        error: function(xhr) {
          displayMessage(responseDiv, '오류 발생: ' + xhr.status + ' ' + xhr.statusText, 'error'); // 오류 발생 시 에러 메시지 표시
        }
      });
    }

    // test_select 함수: 'test_tb' 테이블의 모든 데이터를 조회합니다.
    function test_select() {
      const responseDiv = 'selectResultDisplay'; // 결과를 표시할 div의 ID
      displayMessage(responseDiv, '데이터 조회 중...', 'success'); // 조회 대기 메시지 표시
      $.post("/select.do", function(res) { // '/select.do' 엔드포인트로 POST 요청
        if (res.data && res.data.list) { // 응답 데이터가 유효한지 확인
          let html = '<ul>';
          if (res.data.list.length === 0) html += '<li>데이터가 없습니다.</li>'; // 데이터가 없으면 메시지 표시
          else res.data.list.forEach(item => {
            // 각 데이터를 리스트 아이템으로 변환하여 HTML 생성
            html += `<li>ID: ${item.id}, 이름: ${item.name}, 생성일: ${new Date(item.create_time).toLocaleString()}</li>`;
          });
          html += '</ul>';
          $(`#${responseDiv}`).html(html); // 생성된 HTML을 div에 삽입
        } else displayMessage(responseDiv, '조회 결과 형식이 올바르지 않습니다.', 'error'); // 응답 형식 오류
      }).fail(xhr => {
        displayMessage(responseDiv, '오류 발생: ' + xhr.status + ' ' + xhr.statusText, 'error'); // AJAX 요청 실패 시 에러 메시지 표시
      });
    }

    // test_insert 함수: 'test_tb' 테이블에 새 데이터를 추가합니다.
    function test_insert(msg) {
      const responseDiv = 'insertStatusMessage'; // 상태 메시지를 표시할 div의 ID
      if (!msg) return displayMessage(responseDiv, '이름을 입력하세요.', 'error'); // 이름이 없으면 에러 표시
      displayMessage(responseDiv, '데이터 추가 중...', 'success'); // 추가 대기 메시지 표시
      $.post("/insert.do", { name: msg }, function() { // '/insert.do' 엔드포인트로 POST 요청, 'name' 파라미터 전달
        displayMessage(responseDiv, '데이터가 성공적으로 추가되었습니다.', 'success'); // 성공 메시지 표시
        $('#insertNameInput').val(''); // 입력 필드 초기화
      }).fail(xhr => {
        displayMessage(responseDiv, '오류 발생: ' + xhr.status + ' ' + xhr.statusText, 'error'); // 오류 발생 시 에러 메시지 표시
      });
    }

    // test_delete 함수: 'test_tb' 테이블에서 데이터를 삭제합니다.
    function test_delete(msg) {
      const responseDiv = 'deleteStatusMessage'; // 상태 메시지를 표시할 div의 ID
      if (!msg) return displayMessage(responseDiv, '삭제할 이름을 입력하세요.', 'error'); // 이름이 없으면 에러 표시
      displayMessage(responseDiv, '데이터 삭제 중...', 'success'); // 삭제 대기 메시지 표시
      $.post("/delete.do", { name: msg }, function() { // '/delete.do' 엔드포인트로 POST 요청, 'name' 파라미터 전달
        displayMessage(responseDiv, '데이터가 성공적으로 삭제되었습니다.', 'success'); // 성공 메시지 표시
        $('#deleteNameInput').val(''); // 입력 필드 초기화
      }).fail(xhr => {
        displayMessage(responseDiv, '오류 발생: ' + xhr.status + ' ' + xhr.statusText, 'error'); // 오류 발생 시 에러 메시지 표시
      });
    }

    // createUser 함수: 'users' 테이블에 새 사용자를 생성합니다.
    function createUser() {
      const username = $('#createUsername').val().trim(); // 사용자 이름 가져오기
      const email = $('#createUserEmail').val().trim(); // 이메일 가져오기
      const password = $('#createPassword').val().trim(); // 비밀번호 가져오기
      const responseDiv = 'createUserStatus'; // 상태 메시지를 표시할 div의 ID
      if (!username || !email || !password) // 모든 필드가 채워졌는지 확인
        return displayMessage(responseDiv, '모든 필드를 입력해주세요.', 'error'); // 필드가 비어있으면 에러 표시
      displayMessage(responseDiv, '사용자 생성 중...', 'success'); // 생성 대기 메시지 표시
      $.ajax({
        url: '/users/create', // 사용자 생성 엔드포인트
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ username, email, password }), // JSON 형식으로 사용자 정보 전송
        success: function(res) {
          displayMessage(responseDiv, res.message || '사용자가 성공적으로 생성되었습니다.', 'success'); // 성공 메시지 표시
          $('#createUsername, #createUserEmail, #createUserPassword').val(''); // 입력 필드 초기화
        },
        error: function(xhr) {
          let errorMessage = '알 수 없는 오류';
          try {
            const errorData = JSON.parse(xhr.responseText); // 서버 응답에서 에러 메시지 파싱
            errorMessage = errorData.error || xhr.statusText;
          } catch (e) {
            errorMessage = xhr.statusText;
          }
          displayMessage(responseDiv, '오류 발생: ' + errorMessage, 'error'); // 오류 발생 시 에러 메시지 표시
        }
      });
    }

    // listUsers 함수: 'users' 테이블의 사용자 목록을 조회합니다.
    function listUsers() {
      const responseDiv = 'userListResponse'; // 목록을 표시할 div의 ID
      displayMessage(responseDiv, '사용자 목록 조회 중...', 'success'); // 조회 대기 메시지 표시
      $.ajax({
        url: '/users/list', // 사용자 목록 조회 엔드포인트
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({}), // 빈 JSON 객체 전송
        success: function(res) {
          if (res.success && res.data && res.data.list) { // 응답 데이터가 유효한지 확인
            let html = '<ul>';
            if (res.data.list.length === 0) html += '<li>사용자가 없습니다.</li>'; // 사용자가 없으면 메시지 표시
            else res.data.list.forEach(user => {
              // 각 사용자를 리스트 아이템으로 변환하여 HTML 생성
              html += `<li>ID: ${user.id}, 이름: ${user.username}, 이메일: ${user.email}, 생성일: ${new Date(user.created_at).toLocaleString()}</li>`;
            });
            html += '</ul>';
            $(`#${responseDiv}`).html(html); // 생성된 HTML을 div에 삽입
          } else {
            displayMessage(responseDiv, '사용자 목록 조회 실패: ' + (res.error || '알 수 없는 오류'), 'error'); // 조회 실패 시 에러 메시지 표시
          }
        },
        error: function(xhr) {
          displayMessage(responseDiv, '오류 발생: ' + xhr.status + ' ' + xhr.statusText, 'error'); // 오류 발생 시 에러 메시지 표시
        }
      });
    }

    // getUserStats 함수: 'users' 테이블의 사용자 통계를 조회합니다.
    function getUserStats() {
      const responseDiv = 'userStatsResponse'; // 통계를 표시할 div의 ID
      displayMessage(responseDiv, '사용자 통계 조회 중...', 'success'); // 조회 대기 메시지 표시
      $.ajax({
        url: '/users/stats', // 사용자 통계 조회 엔드포인트
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({}), // 빈 JSON 객체 전송
        success: function(res) {
          if (res.success && res.data) { // 응답 데이터가 유효한지 확인
            displayMessage(responseDiv, `총 사용자 수: ${res.data.total_users}명`, 'success'); // 총 사용자 수 표시
          } else {
            displayMessage(responseDiv, '사용자 통계 조회 실패: ' + (res.error || '알 수 없는 오류'), 'error'); // 조회 실패 시 에러 메시지 표시
          }
        },
        error: function(xhr) {
          displayMessage(responseDiv, '오류 발생: ' + xhr.status + ' ' + xhr.statusText, 'error'); // 오류 발생 시 에러 메시지 표시
        }
      });
    }

    // addProblem 함수: 'problems' 테이블에 새 문제를 추가합니다.
    function addProblem() {
      const question_text = $('#addProblemQuestion').val().trim(); // 문제 내용 가져오기
      const answer_text = $('#addProblemAnswer').val().trim(); // 정답 가져오기
      const category = $('#addProblemCategory').val().trim(); // 카테고리 가져오기
      const difficulty = $('#addProblemDifficulty').val().trim(); // 난이도 가져오기
      const responseDiv = 'addProblemStatus'; // 상태 메시지를 표시할 div의 ID

      if (!question_text || !answer_text) { // 문제 내용과 정답이 모두 입력되었는지 확인
        displayMessage(responseDiv, '문제 내용과 정답을 모두 입력해주세요.', 'error'); // 필드가 비어있으면 에러 표시
        return;
      }
      displayMessage(responseDiv, '문제 추가 중...', 'success'); // 추가 대기 메시지 표시
      $.ajax({
        url: '/problems/add', // 문제 추가 엔드포인트
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ question_text, answer_text, category, difficulty }), // JSON 형식으로 문제 정보 전송
        success: function(res) {
          displayMessage(responseDiv, res.message || '문제가 성공적으로 추가되었습니다.', 'success'); // 성공 메시지 표시
          $('#addProblemQuestion, #addProblemAnswer, #addProblemCategory, #addProblemDifficulty').val(''); // 입력 필드 초기화
        },
        error: function(xhr) {
          let errorMessage = '알 수 없는 오류';
          try {
            const errorData = JSON.parse(xhr.responseText); // 서버 응답에서 에러 메시지 파싱
            errorMessage = errorData.error || xhr.statusText;
          } catch (e) {
            errorMessage = xhr.statusText;
          }
          displayMessage(responseDiv, '오류 발생: ' + errorMessage, 'error'); // 오류 발생 시 에러 메시지 표시
        }
      });
    }

    // listProblems 함수: 'problems' 테이블의 문제 목록을 조회합니다.
    function listProblems() {
      const responseDiv = 'problemListResponse'; // 목록을 표시할 div의 ID
      displayMessage(responseDiv, '문제 목록 조회 중...', 'success'); // 조회 대기 메시지 표시
      $.ajax({
        url: '/problems/list', // 문제 목록 조회 엔드포인트
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({}), // 빈 JSON 객체 전송
        success: function(res) {
          if (res.success && res.data && res.data.list) { // 응답 데이터가 유효한지 확인
            let html = '<ul>';
            if (res.data.list.length === 0) html += '<li>문제가 없습니다.</li>'; // 문제가 없으면 메시지 표시
            else res.data.list.forEach(p => {
              // 각 문제를 리스트 아이템으로 변환하여 HTML 생성 (문제 내용과 정답은 일부만 표시)
              html += `<li>ID: ${p.id}, 문제: ${p.question_text.substring(0, 50)}..., 정답: ${p.answer_text.substring(0, 30)}... (카테고리: ${p.category || '없음'}, 난이도: ${p.difficulty || '없음'})</li>`;
            });
            html += '</ul>';
            $(`#${responseDiv}`).html(html); // 생성된 HTML을 div에 삽입
          } else {
            displayMessage(responseDiv, '문제 목록 조회 실패: ' + (res.error || '알 수 없는 오류'), 'error'); // 조회 실패 시 에러 메시지 표시
          }
        },
        error: function(xhr) {
          displayMessage(responseDiv, '오류 발생: ' + xhr.status + ' ' + xhr.statusText, 'error'); // 오류 발생 시 에러 메시지 표시
        }
      });
    }

    // deleteProblem 함수: 'problems' 테이블에서 문제를 삭제합니다.
    function deleteProblem() {
      const problemId = $('#deleteProblemId').val().trim(); // 삭제할 문제 ID 가져오기
      const responseDiv = 'deleteProblemStatus'; // 상태 메시지를 표시할 div의 ID

      if (!problemId) { // 문제 ID가 입력되었는지 확인
        displayMessage(responseDiv, '삭제할 문제 ID를 입력해주세요.', 'error'); // ID가 없으면 에러 표시
        return;
      }
      displayMessage(responseDiv, `문제 ID ${problemId} 삭제 중...`, 'success'); // 삭제 대기 메시지 표시
      $.ajax({
        url: '/problems/delete', // 문제 삭제 엔드포인트
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ id: problemId }), // JSON 형식으로 문제 ID 전송
        success: function(res) {
          displayMessage(responseDiv, res.message || `문제 ID ${problemId}가 성공적으로 삭제되었습니다.`, 'success'); // 성공 메시지 표시
          $('#deleteProblemId').val(''); // 입력 필드 초기화
          listProblems(); // 문제 목록 새로고침
        },
        error: function(xhr) {
          let errorMessage = '알 수 없는 오류';
          try {
            const errorData = JSON.parse(xhr.responseText); // 서버 응답에서 에러 메시지 파싱
            errorMessage = errorData.error || xhr.statusText;
          } catch (e) {
            errorMessage = xhr.statusText;
          }
          displayMessage(responseDiv, '오류 발생: ' + errorMessage, 'error'); // 오류 발생 시 에러 메시지 표시
        }
      });
    }

    // deleteUser 함수: 'users' 테이블에서 사용자를 삭제합니다.
    function deleteUser() {
      const userId = $('#deleteUserId').val().trim(); // 삭제할 사용자 ID 가져오기
      const responseDiv = 'deleteUserStatus'; // 상태 메시지를 표시할 div의 ID

      if (!userId) { // 사용자 ID가 입력되었는지 확인
        displayMessage(responseDiv, '삭제할 사용자 ID를 입력해주세요.', 'error'); // ID가 없으면 에러 표시
        return;
      }
      displayMessage(responseDiv, `사용자 ID ${userId} 삭제 중...`, 'success'); // 삭제 대기 메시지 표시
      $.ajax({
        url: '/users/delete', // 사용자 삭제 엔드포인트
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ id: userId }), // JSON 형식으로 사용자 ID 전송
        success: function(res) {
          displayMessage(responseDiv, res.message || `사용자 ID ${userId}가 성공적으로 삭제되었습니다.`, 'success'); // 성공 메시지 표시
          $('#deleteUserId').val(''); // 입력 필드 초기화
          listUsers(); // 사용자 목록 새로고침
        },
        error: function(xhr) {
          let errorMessage = '알 수 없는 오류';
          try {
            const errorData = JSON.parse(xhr.responseText); // 서버 응답에서 에러 메시지 파싱
            errorMessage = errorData.error || xhr.statusText;
          } catch (e) {
            errorMessage = xhr.statusText;
          }
          displayMessage(responseDiv, '오류 발생: ' + errorMessage, 'error'); // 오류 발생 시 에러 메시지 표시
        }
      });
    }

    // loginUser 함수: 사용자를 로그인합니다.
    function loginUser() {
    const usernameOrEmail = $('#loginUsernameOrEmail').val().trim(); // 사용자 이름 또는 이메일 가져오기
    const password = $('#loginPassword').val().trim(); // 비밀번호 가져오기
    const responseDiv = 'loginStatus'; // 로그인 상태 메시지를 표시할 div의 ID

    if (!usernameOrEmail || !password) { // 사용자 이름/이메일과 비밀번호가 모두 입력되었는지 확인
        displayMessage(responseDiv, '사용자 이름 또는 이메일과 비밀번호를 모두 입력해주세요.', 'error'); // 필드가 비어있으면 에러 표시
        return;
    }
    displayMessage(responseDiv, '로그인 시도 중...', 'success'); // 로그인 시도 메시지 표시
    $.ajax({
        url: '/users/login', // 백엔드 로그인 라우트
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ usernameOrEmail: usernameOrEmail, password }), // JSON 형식으로 로그인 정보 전송
        success: function(res) {
            if (res.success) {
                displayMessage(responseDiv, '로그인 성공! 환영합니다.', 'success'); // 로그인 성공 메시지 표시
                $('#loginUsernameOrEmail').val(''); // 입력 필드 초기화
                $('#loginPassword').val(''); // 입력 필드 초기화
                // 로그인 성공 후 추가적인 UI 변경 또는 페이지 리다이렉션 로직을 여기에 추가할 수 있습니다.
            } else {
                displayMessage(responseDiv, res.error || '로그인 실패: 정보가 올바르지 않습니다.', 'error'); // 로그인 실패 시 에러 메시지 표시
            }
        },
        error: function(xhr) {
            let errorMessage = '알 수 없는 오류';
            try {
                const errorData = JSON.parse(xhr.responseText); // 서버 응답에서 에러 메시지 파싱
                errorMessage = errorData.error || xhr.statusText;
            } catch (e) {
                errorMessage = xhr.statusText;
            }
            displayMessage(responseDiv, '로그인 오류: ' + errorMessage, 'error'); // 오류 발생 시 에러 메시지 표시
        }
    });
}

    // scrollToSection 함수: 특정 섹션으로 부드럽게 스크롤 이동합니다.
    function scrollToSection(sectionId) {
      const section = document.getElementById(sectionId); // ID에 해당하는 요소 가져오기
      if (section) {
        section.scrollIntoView({ behavior: 'smooth' }); // 부드러운 스크롤 이동
      }
    }

    // logoutUser 함수: 사용자를 로그아웃 처리합니다.
    function logoutUser() {
        const responseDiv = 'loginStatus'; // 로그아웃 상태 메시지를 표시할 div의 ID
        displayMessage(responseDiv, '로그아웃 처리 중...', 'success'); // 로그아웃 처리 중 메시지 표시

        $.ajax({
            url: '/users/logout', // 백엔드 로그아웃 라우트 호출
            method: 'POST', // POST 요청 (세션 무효화 등의 작업이 있을 수 있으므로)
            contentType: 'application/json', // JSON 형식으로 보낼 데이터는 없지만 명시
            data: JSON.stringify({}), // 보낼 데이터 없음
            success: function(res) {
                if (res.success) {
                    displayMessage(responseDiv, res.message || '로그아웃 되었습니다.', 'success'); // 로그아웃 성공 메시지 표시
                    $('#loginUsernameOrEmail').val(''); // 입력 필드 초기화
                    $('#loginPassword').val(''); // 입력 필드 초기화
                    // 로그아웃 후 필요하다면 페이지 리다이렉션 등의 추가적인 로직을 여기에 추가할 수 있습니다.
                } else {
                    displayMessage(responseDiv, res.error || '로그아웃 실패: 알 수 없는 오류', 'error'); // 로그아웃 실패 시 에러 메시지 표시
                }
            },
            error: function(xhr) {
                let errorMessage = '알 수 없는 오류';
                try {
                    const errorData = JSON.parse(xhr.responseText); // 서버 응답에서 에러 메시지 파싱
                    errorMessage = errorData.error || xhr.statusText;
                } catch (e) {
                    errorMessage = xhr.statusText;
                }
                displayMessage(responseDiv, '로그아웃 오류: ' + errorMessage, 'error'); // 오류 발생 시 에러 메시지 표시
            }
        });
    }

  </script>
